<html>
	<title>Json Tables</title>
<style>
#mytable thead th {
	position: sticky;
	top: 0;
	z-index: 100;
	background: #ffd8d8;
}
#mytable {
	overflow: auto;
	/*height: 70vh;*/
	border-collapse: collapse;
}
thead tr {
	background: #333;
}
tr:nth-child(even){
	background: #eee;
}
td,th {
	border: 1px solid #fff;
	
}
th:hover {
	cursor: s-resize;
}
td:hover {
	background: yellow;
	transition: background 500ms;
}
.var {
	width: 100%;
	background: none;
	border: none;
	padding: 4px 2px;
}
.var:focus {
	background: #c1c1ff;

}
#topfieldsets {
	display: grid;
	grid-template-columns: 1fr 1fr 1fr;
	width: calc(100vw - 2em);
	resize: vertical;
	min-height: 125px;
	max-height: 90vh;
	overflow: auto;
	background: aliceblue;
}
#topfieldsets textarea {
	width: 100%;
	height: 100%;
	resize: none;
	min-height: 100%;
	white-space: pre;
	padding: 2px;
	border: 0;
	background: none;
}
.taUpdated {
	outline: 1px solid green;
	transition: outline 500ms;
}
</style>
<script>
'use strict';
var mydata = [];
var mydefs;
function moveRow(dir){
	let thisrow = event.target.parentElement.parentElement;
	let allrows = thisrow.parentElement;
	let currindex = Array.prototype.indexOf.call(allrows.children, thisrow);
	let newpos = currindex+dir;
	if (newpos<0 || newpos>=allrows.children.length){
		// this node cannot move
		console.log('this is last or first node');
		return;
	}
	// we want to move the element in the table
	if (dir===1){
		allrows.insertBefore(allrows.children[newpos], thisrow);
	} else {
		allrows.insertBefore(thisrow, allrows.children[newpos]);
	}
	// and the element in the array
	[mydata[currindex],mydata[newpos]] = [mydata[newpos],mydata[currindex]];
}
function cloneRow(){
	let thisrow = event.target.parentElement.parentElement;
	let allrows = thisrow.parentElement;
	let currindex = Array.prototype.indexOf.call(allrows.children, thisrow);
	let clnrow = thisrow.cloneNode(true);
	clnrow.addEventListener('keydown',rowBinds);
	for (let i=0; i<clnrow.children.length;++i){
		clnrow.children[i].firstElementChild.value = thisrow.children[i].firstElementChild.value;
	}
	thisrow.insertAdjacentElement('afterend',clnrow);
	// clone in mydata
	const jcopy = structuredClone(mydata[currindex]);
	mydata.splice(currindex+1, 0, jcopy);
}
function deleteRow(){
	let thisrow = event.target.parentElement.parentElement;
	let allrows = thisrow.parentElement;
	if (allrows.children.length<=1){
		alert("Can't remove only row!");
		return;
	}
	let currindex = Array.prototype.indexOf.call(allrows.children, thisrow);
	let removed = mydata.splice(currindex, 1);
	console.log(removed);
	allrows.removeChild(thisrow);
}
function th_clicked(){
	let ind = Array.prototype.indexOf.call(event.target.parentElement.children,event.target);
	const newVal = prompt(`Enter new value for column #${ind}:`);
	if (newVal===null){
		return;
	}
	const sure = confirm(`Update all column #${ind} to >${newVal}<?`);
	if (sure){
		for (const c of Array.from(mytable.querySelectorAll(`.col-${ind}`))){
			c.value = newVal;
		}
	}
}
function rowBinds(ev){
	const cur = ev.target;
	const p = cur.parentElement.parentElement;
	if (cur.classList.contains('var')){
		if (ev.ctrlKey){
			let mv;
			let dir=0;
			switch (ev.key){
				case 'ArrowUp':
					mv = p.previousElementSibling;
					dir = -1;
					break;
				case 'ArrowDown':
					mv = p.nextElementSibling;
					dir = 1;
					break;
				default:
					return;
					break;
			}
			if (ev.shiftKey){
				if (dir!=0){
					ev.preventDefault();
					moveRow(dir);
					ev.target.focus();
				}
			} else {
				if (mv){
					const indx = Array.prototype.indexOf.call(p.children,cur.parentElement);
					mv.children[indx].querySelector('.var').focus();
					ev.preventDefault();
				}
			}
		} else if (ev.key=='Enter'){
			let nxtcell = cur.parentElement.nextElementSibling?.querySelector('.var');
			if (nxtcell){
				nxtcell.focus();
				if (nxtcell.tagName=='SELECT'){
					nxtcell.showPicker();
				}
				ev.preventDefault();
			} else {
				p.nextElementSibling?.querySelector('.var')?.focus();
				ev.preventDefault();
			}
			
		}
	}
}
function var_clicked(t){
	if (event.ctrlKey){
		t.select();
		event.preventDefault();
	}
}

function parseDefs(deflines){
	/*
	@priDel=[)
	s[)string header[)string_key[)a|b|c|d[)hover text
	^^
	values are quoted, 'null' means null
	enum means dropdown
	j[)json header[)json_key[)1|2|3|4[)hover text
	^^
	if have enum, will evaluate as dropdown
	otherwise free input
	b[)bool header[)bool_key[)[)hover text
	^^
	shortcut for j with options true|false|null
	m[)mult header[)mult_key[)option1&option2[)hover text
	
	*/
	let lt,type,opts,help,name,path;
	let pridel = ',';
	let defs = new Map();
	for (const l of deflines){
		lt = l.trim();
		if (lt.length===0){
			continue;
		}
		switch(lt[0]){
			case '@':
				help = lt.indexOf('=');
				if (help===-1){
					continue;
				}
				type = lt.substring(0,help);
				opts = lt.substr(help+1);
				switch(type){
					case '@priDel':
						pridel = opts;
					break;
				}
			break;
			case 's':
				[type,name,path,opts,help] = lt.split(pridel);
				defs.set(name,{type:type, path:path, opts:(opts.length>1) ? opts?.split('|') : null, help:help});
			break;
			case 'n':
			case 'j':
				[type,name,path,opts,help] = lt.split(pridel);
				defs.set(name,{type:'j', path:path, opts:(opts.length>1) ? opts?.split('|') : null, help:help});
			break;
			case 'b':
				[type,name,path,opts,help] = lt.split(pridel);
				defs.set(name,{type:'j', path:path, opts:['true','false'], help:help});
			break;
		}
	}
	return defs;
}
function makeControl(v, def){
	let c;
	if (def.opts){
		c = tmpl_enum.content.cloneNode(true).firstElementChild;
		for (const op of def.opts){
			c.appendChild(document.createElement('option')).textContent = op;
		}
	} else {
		switch (def.type){
			case 's':
				c = tmpl_str.content.cloneNode(true).firstElementChild;
			break;
			case 'j':
				c = tmpl_json.content.cloneNode(true).firstElementChild;
			break;
		}
	}
	if (v===null){
		c.value = "'null'";
	} else {
		if (def.type=='j'){
			c.value = JSON.stringify(v);
		} else {
			c.value = v;
		}
	}
	return c;
}

function build(){
	if (mydata.length){
		alert('Already built');
		return;
	}
	let defs = parseDefs(inputDefs.value.split('\n'));
	if (defs.size<1){
		alert('No valid defs!');
		return;
	}
	event.target.hidden = true;
	inputJson.readOnly = inputDefs.readOnly = true;
	mydefs = defs;
	let tbl = mytable;
	let tblb = tbl.querySelector('tbody');
	let r = tbl.querySelector('thead').insertRow(-1);
	let c,v,ctrl,i;
	mydata = JSON.parse(inputJson.value);
	for (const [name,def] of defs){
		//console.log(name,def);
		c = r.appendChild(document.createElement('th'));
		c.addEventListener('click',th_clicked);
		c.textContent = name;
	}
	r.appendChild(document.createElement('th')).textContent = 'CONTROLS';
	
	for (const dr of mydata){
		r = tblb.insertRow(-1);
		r.addEventListener('keydown',rowBinds);
		i = 0;
		for (const [name,def] of defs){
			c = r.insertCell(-1);
			ctrl = makeControl(dr[def.path],def);
			ctrl.classList.add(`col-${i++}`);
			c.appendChild(ctrl);
		}
		c = r.appendChild(tmpl_ctrls.cloneNode(true).content);
	}
	fsdetails.open = false;
}

function generate(){
	// first update mydata
	if (outputJson.value.length>0){
		let x = confirm('Output not empty, are you sure?');
		if (!x) return;
	}
	let tbl = mytable;
	let tblb = tbl.querySelector('tbody');
	let dataRows = Array.from(tblb.querySelectorAll('tr'));
	if (dataRows.length<1){
		alert('No rows to generate!');
		return;
	}
	let v, vs, vi;
	for (const [i,dr] of dataRows.entries()){
		//console.log(i,dr);
		vs = Array.from(dr.querySelectorAll('.var')).map(e=>e.value);
		vi = 0;
		for (const [name,def] of mydefs){
			v = vs[vi];
			if (v==="'null'"){
				v = null;
			} else if (def.type==='j'){
				if (v.length===0){
					v = null;
				} else {
					v = JSON.parse(v);
				}
			}
			mydata[i][def.path] = v;
			vi++;
		}
	}
	outputJson.value = JSON.stringify(mydata,null,2);
	outputJson.classList.add('taUpdated');
	fsdetails.open = true;
}

function saveoutput(){
	let ta = outputJson.value;
	if (ta.length<1){
		return;
	}
	let b = new Blob([ta]);
	let a = document.createElement('a');
	a.href = URL.createObjectURL(b);
	a.download = 'json_array.json';
	a.click();
	URL.revokeObjectURL(a.href);
}
function clearoutput(){
	if (outputJson.value.length<1 || !confirm('Are you sure?')){
		return;
	}
	outputJson.value = '';
}

</script>
<body>
<details id='fsdetails' open>
	<summary>Controls
	<button onclick='build()'>Build</button>
	<button onclick='generate()'>Generate</button>
	<button onclick='saveoutput()'>Save Output</button>
	<button onclick='clearoutput()'>Clear Output</button>
	<button onclick='dia_help.show()'>Help</button>
	</summary>
	<div id='topfieldsets'>
		<fieldset class='rfieldset'>
			<legend>Input Json Array</legend>
			<textarea id='inputJson'>
[{"string_key":"string1", "enum_string_key": "a", "json_key":1, "enum_number_key": 1, "bool_key": true}
,{"string_key":"string2", "enum_string_key": "b", "json_key":4, "enum_number_key": 2, "bool_key": false}
,{"string_key":"string3", "enum_string_key": null, "json_key":[1,2,3], "enum_number_key": null, "bool_key": null}
]
			</textarea>
		</fieldset>

		<fieldset class='rfieldset'>
			<legend>Input Defs</legend>
			<textarea id='inputDefs'>
@priDel=[)
s[)string header[)string_key[)[)hover text
s[)enum string[)enum_string_key[)a|b|c|d[)hover text
j[)json header[)json_key[)[)hover text
j[)enum number[)enum_number_key[)1|2|3|4[)hover text
b[)bool header[)bool_key[)[)hover text
			</textarea>
		</fieldset>

		<fieldset>
			<legend>Output Json Array</legend>
			<textarea id='outputJson'></textarea>
		</fieldset>

	</div>
</details>

<table id='mytable'>
	<thead></thead>
	<tbody></tbody>
</table>


<dialog id='dia_help'>
<h1>Help</h1>
<ol>
<li>Paste your json array in the input json array section</li>
<li>Paste your json def in the input defs section</li>
<li>Click Build</li>
<li>Modify your rows in the generated table</li>
</ol>
<button onclick='this.parentElement.close()'>Hide</button>
</dialog>



<template id='tmpl_enum'>
<select class='var' style='text-align:center'>
	<option>'null'</option>
</select>
</template>
<template id='tmpl_str'>
<input class='var' placeholder='{empty string}' onclick='var_clicked(this)'/>
</template>
<template id='tmpl_json'>
<input class='var' style='text-align: right' placeholder='null' onclick='var_clicked(this)' />
</template>
<template id='tmpl_ctrls'>
	<td style='display:grid;grid-template-columns:repeat(4, 1fr)'>
		<button onclick='moveRow(-1)' title='Move up'>⬆</button>
		<button onclick='deleteRow()' title='Delete'>🗑</button>
		<button onclick='cloneRow()' title='Clone'>👯</button>
		<button onclick='moveRow(1)' title='Move down'>⬇</button>
	</td>
</template>

</body>
