<script>
'use strict';
var myjson, mydefs, lastDef, priDel=',', jsonIndent=3, customStyles=[];
var subDefs = new Map();
var errorFlag = false;

class HeatNode {
	constructor(partialPath){
		this.children = {};
		this.isLeaf = false;
		this.fullPath = partialPath;
	}
	getChild(name){
		if (this.isLeaf){
			// leaves can't have children
			return null;
		} else {
			if (name in this.children){
				return this.children[name];
			} else {
				this.children[name] = new HeatNode(this.fullPath+'.'+name);
				return this.children[name];
			}
		}
	}
};

function check_paths(paths){
	// check whether all paths are unique and not subsets of each other
	// example call
	// check_paths(['hello','helloworld','hello.world','hello.fresh.ton'])
	//  'hello' won't appear in list
	const badPaths = [],
		hm = new HeatNode('');
	let pathParts, current, badPath;
	for (const path of paths){
		pathParts = path.split('.');
		current = hm;
		badPath = false;
		for (const part of pathParts){
			if (current.isLeaf){
				console.error(`leaf mid branch at ${path}`);
				badPaths.push(current.fullPath);
				badPath = true;
				break;
			}
			current = current.getChild(part);
			if (current==null){
				console.error(`leaf mid branch at ${path}. (trying to get child of a leaf)`);
				badPath = true;
				break;
			}
		}
		if (badPath){
			badPaths.push('.'+path);
			continue;
		}
		// at this point, we should be at the end of path
		if (current && Object.keys(current.children).length>0){
			console.error(`${path} has children but is leaf`);
			badPath = true;
		}
		if (current.isLeaf){
			console.error(`${path} is already marked a leaf, path not unique`);
			badPath = true;
		} else {
			current.isLeaf = true;
			// this is the best outcome for path
		}
		if (badPath){
			badPaths.push('.'+path);
		}
	}
	return badPaths;
}

function helper_check_mydefs(){
	// gather all paths from mydefs
	const paths = [];
	for (const [name,def] of mydefs.entries()){
		if (def.type in classHookMap){
			paths.push(...def.path);
		}
	}
	return check_paths(paths);
}
function specialACommands(line){
	const [cmd,val] = line.split('=');
	switch (cmd){
		case '@del':
			priDel = val;
			break;
		case '@indent':
			jsonIndent = (val=='t') ? '\t' : Number(val);
			break;
		case '@style':
			customStyles.push(val);
			let sy = document.head.appendChild(document.createElement('style'));
			sy.textContent = val;
			break;
		case '@title':
			document.title=val;
			break;
		default:
			break;
	}
}
function subdefHandle(line){
	const [t,name,sDel,defs] = line.split(priDel);
	subDefs.set(name,defs.split(sDel));
}
function defParse(lines,defaultType='j'){
	const r = new Map();
	let name, path, type, opts, notes, line, val;
	for (const lineWS of lines){
		line = lineWS.trim();
		if (line.length==0){
			continue;
		}
		type = line[0];
		switch (type){
			case '#':
				break;
			case '@':
				specialACommands(line);
				break;
			case '~':
			case '=':
			// separator or code
				r.set(line,{path: line, type: type});
				break;
			case '{':
				subdefHandle(line);
				break;
			case '!':
				[type,name,notes] = line.split(priDel);
				if (!r.has(name)){
					r.set(name,{type: '!', notes: [notes.trim()]});
				} else {
					r.get(name).notes.push(notes.trim());
				}
				break;
			case 'd':
			case (type in classHookMap) ? type : null:
				[type,name,path,opts,notes] = line.split(priDel);
				lastDef = name;
				if (!name || !path || name.trim().length==0 || path.trim().length==0){
					console.error(`invalid name "${name}" or invalid path "${path}"`);
					r.set(line,{type: 'err'});
				} else if (r.has(name)){
					console.error(`${name} already defined, ignoring`);
				} else {
					r.set(name,{path: path.split('|'), type: type ?? defaultType, opts: opts?.trim(), notes: notes?.trim()});
				}
				break;
			default:
				console.error(`Unrecognized type ${type}`);
				r.set(line,{type: 'err'});
				break;
		}
	}
	return r;
}
function traceJson(j,path){
	const dpath = path.split('.');
	let vnode = j;
	for (const crumb of dpath){
		if (vnode && (typeof vnode == 'object') && crumb in vnode){
			// vnode of the previous loop should always be an object
			// because 'leaves' cannot be midpoints
			vnode = vnode[crumb];
		} else {
			console.error(`lost.. json does not have ${path}`);
			return undefined;
		}
	}
	return vnode;
}
function setJson(j,path,newValue){
	const dpath = path.split('.');
	let pvnode = undefined;
	let vnode = j;
	for (const crumb of dpath){
		if (crumb in vnode){
			pvnode = vnode;
			vnode = vnode[crumb];
		} else {
			console.error(`lost.. json does not have ${path}`);
			alert(`lost.. json does not have ${path}`);
			return;
		}
	}
	pvnode[dpath[dpath.length-1]] = newValue;
}

}

class FieldSetControl {

		let fs = document.createElement('fieldset');
		fs.appendChild(document.createElement('legend')).textContent = name;
		fs.appendChild(ctrl);
		fs.appendChild(fsNotes.content.cloneNode(true))

	}
	get isNull(){

	}

	}
	
	static enumSubTypes(opts){
		// helper function to create enumcontrols
		const fs = tEnumControl.content.cloneNode(true),
			sel = fs.querySelector('select');

}

class StringFieldSet extends FieldSetControl {

class BoolFieldSet extends FieldSetControl {
	constructor(name,opts,v){
		super(name,tBoolControl.content.cloneNode(true));
		for (const i of this.control.querySelectorAll('input')){
			i.name = name;

		this.control.querySelector(`input[value=${v?? 'null'}`).checked = true;

	}
	get nullOrVal(){
		return JSON.parse(this.control.querySelector('input:checked').value);

}
class JsonFieldSet extends FieldSetControl {
	constructor(name,opts,v){
		super(name,tJsonControl.content.cloneNode(true));
		if (opts?.length){
			this.control.querySelector('.allowKVedit').hidden=false;
		}
		this.name = name;
		const ta = this.control.querySelector('.val');
		ta.value = JSON.stringify(v,null,jsonIndent);
		ta.rows = Math.min(40, 1 + Array.from(ta.value.matchAll('\n')).length);
	}
	get val(){
		try {
			return JSON.parse(this.control.querySelector('.val').value);
		} catch (parseErr){
			alert(`Validate '${this.name}' : '${parseErr.message}'`);
			this.control.querySelector('.val').setCustomValidity(parseErr.message);
			this.control.scrollIntoView();
			return undefined;
		}
	}
	get isNull(){
		const v = this.control.querySelector('.val').value.trim();
		return v.length==0 || v=='null';
	}
	static tbl(par){
		let val = par.querySelector('.val'),
			name = par.querySelector('legend').textContent,
			opt = mydefs.get(name).opts.split('|').map(o=>o.split('=')),
			tb = tableKVEdit.querySelector('tbody'),
			row, json, cell;
		if (val.value.length==0 || val.value=='null'){
			return;
		}
		try {
			json = JSON.parse(val.value);
			val.setCustomValidity('');
		} catch (err){
			val.setCustomValidity(err.message);
			return;
		}
		tableKVEdit.querySelector('h2').textContent = name; 
		tb.replaceChildren();
		for (const [o,t] of opt){
			if (o.length==0 || t.length==0){
				alert('Table not setup in defs');
				return;
			}
			row = tb.insertRow(-1);
			// key cell
			row.appendChild(document.createElement('th')).textContent=o;
			// change cell depending t - todo
			// value cell
			cell = row.insertCell(-1);
			cell.contentEditable=true;
			if (t=='j'){
				cell.textContent = JSON.stringify(json[o]);
			} else {
				cell.textContent = `${(json[o]===null) ? "'null'" : json[o]}`
			}
		}
		val.disabled = true;
		tableKVEdit.querySelector('.tblNotes').textContent = par.querySelector('.notes').textContent;
		val = tableKVEdit.querySelector('div');
		val.scrollTop = val.scrollLeft = 0;
		tableKVEdit.show();
	}
	static returnTable(){
		let name = tableKVEdit.querySelector('h2').textContent,
			optTypes = new Map(mydefs.get(name).opts.split('|').map(o=>o.split('='))),
			json = JSON.parse(mydefs.get(name).control.querySelector('textarea').value),
			ctrl = mydefs.get(name).control.querySelector('textarea'),
			t;
		let vals = Array.from(tableKVEdit.querySelectorAll('tbody tr')).map(r=>[r.children[0].textContent,r.children[1].textContent]);
		for (let [o,v] of vals){
			t = optTypes.get(o);
			if (v==="'null'" || (t!='s' && v.length==0)){
				v = null;
			} else if (t!='s'){
				try {
					v = JSON.parse(v);
				} catch {
					// make it invalid in ui
					alert('err');
					return;
				}
			}
			json[o]=v;
		}
		ctrl.value = JSON.stringify(json,null,jsonIndent);
		ctrl.disabled = false;
		tableKVEdit.close();
	}
	static subhook(par){
		//let par = event.target.parentElement;
		let name = par.parentElement.querySelector('legend').textContent;
		//let jv = par.querySelector('textarea');
		if (subDefs.has(name)){
			let jv = event.target.parentElement.querySelector('textarea');
			console.log(name,jv);
			let swin = window.open(window.location,'_blank','popup=true');
			swin.onload = ()=>{
				swin.inputJson.value = jv.value;
				swin.document.title = `minihook : ${name}`;
				swin.inputDefs.value = subDefs.get(name).join('\n');
				swin.subDefs.set(name,subDefs.get(name));
				let pb = swin.document.querySelector('#updateAreaDets summary').appendChild(swin.document.createElement('button'));
				pb.textContent = '↩ Post Back';
				pb.addEventListener('click',()=>{
					if (swin.updateArea.value.length && confirm(`Update received for ${name}, continue?`)){
						jv.value = swin.updateArea.value;
					}
				});
			};
		} else {
			alert(`Subhook not defined for ${name}`);
		}
	}
}

class ListFieldSet extends FieldSetControl {
	constructor(name,opts,v){
		super(name,tFlatListControl.content.cloneNode(true));
		this.opts = opts;
		if (v!=null){
			this.control.querySelector('.val').value = v.join('\n');
			this.control.querySelector('.val').rows = Math.min(40, 1 + v.length);
		} else {
			this.control.querySelector('.valIsNull').checked = this.control.querySelector('.val').disabled = true;
		}

	get val(){
		let v = this.control.querySelector('.val').value;
		if (v.length==0){
			return [];
		} else {
			v = v.split('\n');
			return this.opts=='n' ? v.map(x=>Number(x)) : v;
		}
	}

class MultiSelFieldSet extends FieldSetControl {
	constructor(name,opts,v){
		super(name,tMultiControl.content.cloneNode(true));
		const sel = this.control.querySelector('select');
		const mopts = new Map();
		for (const [i,e] of opts.split('&').entries()){
			if (mopts.has(e)){
				errLog.value += `Warning: '${name}' has non-distinct multi-select options (${i})\n\n`;
			} else {
				sel.appendChild(document.createElement('option')).textContent = e;
				mopts.set(e,i);
			}
		}
		if (v!=null){
			for (const ar of v){
				sel.options[mopts.get(ar)].selected = true;
			}
		} else {
			this.control.querySelector('.valIsNull').checked = this.control.querySelector('.val').disabled = true;
		}
	}
	get val(){
		return Array.from(this.control.querySelector('.val').selectedOptions).map(o=>o.text);
	}
}
class ObjectsFieldSet extends FieldSetControl {
	constructor(name,opts,v){
		super(name,tObjectsControl.content.cloneNode(true));
		this.name = name;
		let cj,
			cont = this.control.querySelector('.vals');
		if (v==null){
			cj = tInnerObject.content.cloneNode(true).firstElementChild;
			cj.querySelector('.val').disabled = this.control.querySelector('.valIsNull').checked = true;
			cont.appendChild(cj);
		} else {
			for (const e of v){
				cj = tInnerObject.content.cloneNode(true).firstElementChild;
				cj.querySelector('.val').value = JSON.stringify(e,null,jsonIndent);
				cont.appendChild(cj);
			}
		}
	}
	get val(){
		let j = [];
		try {
			if (this.control.querySelector('.innerVal')){
				j = JSON.parse(this.control.querySelector('textarea').value);
			} else {
				let tx;
				for (const x of Array.from(this.control.querySelectorAll('textarea'))){
					tx = x.value.trim();
					if (tx.length>0 && tx!='null'){
						j.push(JSON.parse(tx));
					}
				}
			}
		} catch (parseErr){
			alert(`Validate '${this.name}' : '${parseErr.message}'`);
			this.control.scrollIntoView();
			return undefined;
		}
		return j;
	}
	static add(par){
		if (!(par.querySelector('.valIsNull').checked)){
			const cont = par.querySelector('.vals'),
				subCtrl = tInnerObject.content.cloneNode(true).firstElementChild;
			cont.appendChild(subCtrl);
		}
	}
	static div(par){
		if ((par.querySelector('.valIsNull').checked)){ return; }
		const cont = par.querySelector('.vals'),
			iv = par.querySelector('.innerVal'),
			isCombined = iv!=null;
		if (isCombined){
			try {
				let j = JSON.parse(iv.querySelector('.val').value),
					cj, t;
				for (const e of j){
					cj = tInnerObject.content.cloneNode(true).firstElementChild;
					t = JSON.stringify(e,null,jsonIndent);
					cj.querySelector('.val').value = t;
					cj.querySelector('.val').rows = Math.min(15, 1 + Array.from(t.matchAll('\n')).length);
					cont.appendChild(cj);
				}
				cont.removeChild(iv);
			} catch(err){
				iv.querySelector('.val').setCustomValidity(`Failed to split, JSON invalid. ${err.message}`);
				return;
			}
		} else {
			let vs = [];
			for (const cj of cont.querySelectorAll('.val')){
				if (cj.value.length){
					vs.push(cj.value);
				}
			}
			try {
				let j = JSON.parse(`[${vs.join(',')}]`),
					cmb = tInnerCmbObject.content.cloneNode(true).firstElementChild,
					t = JSON.stringify(j,null,jsonIndent);
				cmb.querySelector('.val').value = t;
				cmb.querySelector('.val').rows = Math.min(20, 1 + Array.from(t.matchAll('\n')).length);
				cont.appendChild(cmb);
				
			} catch(err){
				alert(`Failed to combine, JSON invalid. ${err.message}`);
				return;
			}
			for (const cj of cont.querySelectorAll('.innerCval')){
				cont.removeChild(cj);
			}
		}
		const but = par.querySelector('.splDivButton');
		but.textContent = (but.textContent=='🖇') ? '📎' : '🖇';
		par.querySelector('.stateDiv').hidden = !(par.querySelector('.stateCmb').hidden = isCombined);
		par.scrollIntoView();
	}
	static tbl(par){
		let inv = par.querySelector('.innerVal');
		if (!inv){
			alert('Combine values first!');
			return;
		}
		let name = par.querySelector('legend').textContent,
			opt = mydefs.get(name).opts.split('|').map(o=>o.split('=')),
			th = tableEdit.querySelector('thead tr'),
			tb = tableEdit.querySelector('tbody'),
			row, json, cell;
		inv = inv.querySelector('textarea');
		try {
			json = JSON.parse(inv.value);
			inv.setCustomValidity('');
		} catch (err){
			inv.setCustomValidity(err.message);
			return;
		}
		tableEdit.querySelector('h2').textContent = name; 
		th.replaceChildren();
		for (const [o,t] of opt){
			if (o.length==0 || t.length==0){
				alert('Table not setup in defs');
				return;
			}
			cell = th.appendChild(document.createElement('th'));
			cell.textContent = o;
			cell.classList.add(`thType_${t}`);
		}
		tb.replaceChildren();
		for (const e of json){
			row = tb.insertRow(-1);
			row.contentEditable = true;
			for (const [o,t] of opt){
				if (t=='j'){
					row.appendChild(document.createElement('td')).textContent = JSON.stringify(e[o]);
				} else {
					row.appendChild(document.createElement('td')).textContent = `${(e[o]===null) ? "'null'" : e[o]}`;
				}
			}
		}
		inv.disabled = true;
		tableEdit.querySelector('.tblNotes').textContent = par.querySelector('.notes').textContent;
		inv = tableEdit.querySelector('div');
		inv.scrollTop = inv.scrollLeft = 0;
		tableEdit.show();
	}
	static returnTable(){
		let name = tableEdit.querySelector('h2').textContent,
			opt = mydefs.get(name).opts.split('|').map(o=>o.split('=')),
			rows = Array.from(tableEdit.querySelectorAll('tbody tr')),
			json = JSON.parse(mydefs.get(name).control.querySelector('textarea').value),
			ctrl = mydefs.get(name).control.querySelector('textarea'),
			o,t,v;
		for (let i=0;i<rows.length;++i){
			for (let [j,ot] of opt.entries()){
				[o,t] = ot;
				v = rows[i].children[j].textContent;
				if (v==="'null'" || (t!='s' && v.length==0)){
					v = null;
				} else if (t!='s'){
					try {
						v = JSON.parse(v);
					} catch {
						alert('Table invalid');
						rows[i].children[j].classList.add('jsonInvalid');
						return;
					}
				}
				json[i][o] = v;
			}
		}
		ctrl.value = JSON.stringify(json,null,jsonIndent);
		ctrl.disabled = false;
		tableEdit.close();
	}
}

const classHookMap = 
	{s:{f:StringFieldSet, t: String}
	,b:{f:BoolFieldSet, t: Boolean}
	,n:{f:NumberFieldSet, t: Number}
	,j:{f:JsonFieldSet, St: Object}
	,dt:{f:DateFieldSet, t: String}
	,l:{f:ListFieldSet, t:Array}
	,m:{f:MultiSelFieldSet, t:Array}
	,o:{f:ObjectsFieldSet, t:Array}
};

function createControlClass(name,hook,cv){
	let htype = 'j';
	if (hook.type!=htype && hook.type in classHookMap){
		// j is compatible with all values
		if (cv===null || cv.constructor == classHookMap[hook.type].t){
			// null is always compatible
			// validate hook.type is compatible with cv's type
			htype = hook.type;
		}
	}
	const ctrl = new classHookMap[htype].f(name,hook.opts,cv);
	if (hook.notes?.length){
		ctrl.control.querySelector('.notes').textContent = hook.notes;
	}
	if (hook.type != htype){
		ctrl.control.classList.add('typeMismatch');
		errLog.value += `Type mismatch '${name}': ${hook.type} -> ${htype}\n\n`;
		hook.type = htype;
	}
	return ctrl;
}

const many2manyTypes = new Set(['s','b','n','dt']);

function buildRoutine(defs){
	const afrag = new DocumentFragment();
	let cn, cv, cvs, many2manyDetected;
	for (const [name,hook] of defs.entries()){
		if (hook.type=='~'){
			cv = name.match(/~+/)[0].length;
			cn = name.substr(cv,name.length);
			afrag.appendChild(createSep(cn,cv));
			if (cv==2){
				gotoDef.appendChild(document.createElement('optgroup')).label = cn;
			}
		} else if (hook.type=='='){
			afrag.appendChild(createCode(hook));
		} else if (hook.type=='err'){
			cn = document.createElement('span');
			cn.classList.add('fieldError');
			cn.textContent = `Unable to create ${name}. Invalid DEF`;
			afrag.appendChild(cn);
			errLog.value += `Unable to create ${name}. Invalid DEF\n\n`;
		} else if (hook.type=='!'){
			if (errorFlag){
				errLog.value += hook.notes.join('\n')+'\n\n';
			}
		} else {
			cv = undefined;
			many2manyDetected = false;
			try {
				if (many2manyTypes.has(hook.type)){
					cvs = [];
					for (const [i,p] of hook.path.entries()){
						cvs.push(traceJson(myjson,p));
						if (!many2manyDetected && i!=0 && cvs[0]!=cvs[i]){
							many2manyDetected = true;
						}
					}
					cv = cvs[0];
				} else {
					cv = traceJson(myjson,hook.path[0]);
				}
				if (cv === undefined){
					// don't create the control if path is not valid
					// prevent trying to update this path
					cn = document.createElement('span');
					cn.classList.add('fieldError');
					cn.textContent = `Unable to create ${name} at ${hook.path}. Please update JSON or DEFS to remove this error.`;
					errLog.value += `Value undefined '${name}' at '${hook.path}'\n\n`;
					hook.type = 'err';
					errorFlag = true;
					afrag.appendChild(cn);
					continue;
				}
				cn = createControlClass(name,hook,cv);
				if (cn){
					hook.var = cn;
					hook.control = afrag.appendChild(cn.control);
					hook.control.title = hook.path.join('\n');
					gotoDef.appendChild(document.createElement('option')).textContent = name;
					errorFlag = false;
					if (many2manyDetected){
						errLog.value += `Multiple values mapped to single control: '${name}'\n pathes: ${hook.path}\n  ${cvs.join('\n  ')}\n\n`;
					}
				}
			} catch(err) {
				cn = document.createElement('span');
				cn.classList.add('fieldError');
				cn.textContent = `Exception creating ${name}. Check ${hook.path}. ${err.message}`;
				afrag.appendChild(cn);
				errLog.value += `Invalid path for '${name}' at '${hook.path}'\n\n`;
				errorFlag = true;
			}
		}
	}
	return afrag;
}

function tryBuild(verbose=false){
	const con = verbose? a=>console.log(a) : a=>{};
	try {
		myjson = JSON.parse(inputJson.value);
		inputJson.setCustomValidity('');
	} catch (parseErr){
		inputJson.setCustomValidity(parseErr.message);
		return;
	}
	if (jsonfileinput.files.length==1){
		outputFileName.value = jsonfileinput.files[0].name;
		document.title = `jsonhooks: ${outputFileName.value}`;
	}
	Array.from(document.querySelectorAll('.preBuildButton')).forEach(b=>b.hidden = true);
	inputJson.readOnly = inputDefs.readOnly = true;
	con('**input json**');
	con(myjson);
	mydefs = defParse(inputDefs.value.trim().split('\n'));
	con('**input defs**');
	con(mydefs);
	con('**sound out values in json**');
	errLog.value = '';
	controls.appendChild(buildRoutine(mydefs));
	inputJsonDet.open = inputDefsDet.open = updateAreas.hidden = false;
	inputJson.ondrop = inputDefs.ondrop = undefined;
	leftPane.style.width = '';
	if (errLog.value.length){
		buildLog.show();
	}
	if (localStorage.getItem('wideView')=='true'){
		toggleWideView();
	}
	controls.scrollTop = 0;
}

function tryUpdate(){
	if (!myjson || !mydefs){
		return;
	}
	let v;
	for (const [name,hook] of mydefs.entries()){
		v = undefined;
		if (hook.type in classHookMap){
			v = hook.var.nullOrVal;
			if (v===undefined){
				return;
			} else {
				for (const mpath of hook.path){
					console.log(`updating ${name} at ${mpath} to ${v}`);
					setJson(myjson,mpath,v);
				}
			}
		} else {
			switch (hook.type){
				case '~':
				case '=':
					break;
				default:
					console.log(`skipping type ${hook.type}`);
					break;
			}
		}
	}
	updateArea.value = JSON.stringify(myjson,null,jsonIndent);
	updateAreaDets.querySelector('.areaTimestamp').textContent = new Date();
	updateAreaDets.open = true;
	updateAreaDets.scrollIntoView();
}

function validateFormat(){
	const v = event.target.parentElement.querySelector('.val');
	try {
		v.value = JSON.stringify(JSON.parse(v.value),null,jsonIndent);
		v.rows = Math.min(40, 1 + Array.from(v.value.matchAll('\n')).length);
		v.setCustomValidity('');
	} catch(err){
		v.setCustomValidity(err.message);
	}
}
function toggleNotesEditable(){
	const mode = controls.querySelector('.notesEd') ? 'false' : 'plaintext-only';
	for (const n of Array.from(controls.querySelectorAll('.notes'))){
		n.classList.toggle('notesEd');
		n.contentEditable = mode;
	}
}
function pullDefs(){
	const r = [];
	r.push(`@del=${priDel}`);
	for (const sty of customStyles){
		r.push(`@style=${sty}`);
	}
	for (const [name,hook] of mydefs.entries()){
		if (hook.type=='~' || hook.type=='='){
			r.push(hook.path);
		} else if (hook.type=='!'){
			for (const n of hook.notes){
				r.push(`!${priDel}${name}${priDel}${n}`);
			}
		} else if (hook.type in classHookMap){
			r.push(`${hook.type}${priDel}${name}${priDel}${hook.path.join('|')}${priDel}${hook.opts?? ''}${priDel}${hook.control.querySelector('.notes').textContent.replace(',',';')}`);
		} else {
			console.error(`Unrecognized type ${hook.type}; skipping`);
		}
	}
	return r;
}
function exportDefsToDialog(){
	defExported.querySelector('textarea').value = pullDefs().join('\n');
	defExported.show();
}
function gotoDefChange(key){
	const ctrl = mydefs.get(key).control;

}
function save(par,filename){
	const ta = par.querySelector('textarea')?.value;
	if (ta?.length>0){
		const d = new Date(), b = new Blob([ta]), a = document.createElement('a');
		a.href = URL.createObjectURL(b);
		a.download = `${d.getFullYear()}${d.getMonth()+1}${d.getDate()}${d.getHours()+1}${d.getMinutes()}_${filename}`;
		a.click();
		URL.revokeObjectURL(a.href);
	} else {
		alert('Textarea is empty!');
	}
}
function loadFileOnTextarea(i){
	const t = i.parentElement.parentElement.querySelector('textarea');
	if (i.files.length==1){
		const reader = new FileReader();
		reader.onload = ()=> t.value = reader.result;
		reader.onerror = ()=> alert('Error reading file');
		reader.readAsText(i.files[0]);
	}
}
function textareaFileDrop(event){
	if (event.dataTransfer.files.length==1){
		event.preventDefault();
		const reader = new FileReader();
		reader.onload = ()=> event.target.value = reader.result;
		reader.onerror = ()=> alert('Error reading file');
		reader.readAsText(event.dataTransfer.files[0]);
		outputFileName.value = event.dataTransfer.files[0].name;
	}
}
function toggleWideView(){
	if (leftPane.style.height==''){
		container.style.gridTemplateRows = 'min-content 1fr';
		container.style.gridTemplateColumns = leftPane.style.height = controls.style.height = 'unset';
		localStorage.setItem('wideView', 'true');
	} else {
		container.style.gridTemplateRows = container.style.gridTemplateColumns = leftPane.style.height = controls.style.height = '';
		localStorage.setItem('wideView', 'false');
	}
}

function selectChromeFix(s){
	if (s.selectedIndex!=0 && !!window.chrome){

function selectCode(ele){
	let r = document.createRange();
	r.selectNodeContents(ele.target);
	window.getSelection().removeAllRanges();
	window.getSelection().addRange(r);
}
function addAcontrol_add(){
	let name = document.getElementById('addAcontrol_name').value.trim();
	if (mydefs.has(name)){
		return;
	}
	let path = document.getElementById('addAcontrol_path').value.trim().split('|'),
		cv = traceJson(myjson,path[0]);
	if (cv===undefined){
		return;
	}
	let newdef = {path: path, 
		type: document.getElementById('addAcontrol_type').value,
		opts: document.getElementById('addAcontrol_opts').value.trim(),
		notes: document.getElementById('addAcontrol_notes').value.trim()
	};
	let cn = createControlClass(name,newdef,cv);
	if (cn){
		newdef.var = cn;
		newdef.control = controls.appendChild(cn.control);
		newdef.control.title = newdef.path.join('\n');
		gotoDef.appendChild(document.createElement('option')).textContent = name;
		mydefs.set(name,newdef);
		addAcontrol.close();
	} else {
		// error here
	}
}

~~Header 1- Basic types
~~~The basic controls
s[)String Control[)a_string[)[)'s' denotes a string control

n[)Number Control[)a_number[)[)'n' denotes a number control
dt[)Date Control[)a_date[)[)'dt' denotes a date control
l[)List Control[)a_list[)[)'l' denotes a homogeneous list control. a 'n' in opts denotes it as a number list.
~~Header 2- Even more basic Types
s[)Enum String Control[)an_object.enum_string[)apple|banana[)Having a pipe delimited list in opts creates an enum control.
n[)Enum Number Control[)an_object.enum_number[)1|2|3|4|5[)Similar with numbers[) the 'n' causes the result to be cast to number in output
b[)Bool Control[)an_object.a_bool[)[)'b' denotes a bool control
j[)Json Control[)an_object.a_json[)inner-key=s|branch-node=b[)'j' denotes a json control
{[)Json Control[)`[)s,inner-key,inner-key`o,branch-node,branch-node

s[)Array Indexing Value 0[)indexable.0[)[)Using a number in the path can refer to that index in an array
b[)Array Indexing Value 1 Child Key[)indexable.1.obj-in-array[)[)You can even refer to objects inside arrays
~~Header 4- Multi-path
s[)Multi-path string[)repeated-string|repeated-string-dup[)[)You can include multiple paths with pipes. The same value will be put to every path.

s[)Invalid Path[)myinvalidpath[)[)This path will result in an error

j[)Invalid Branching[)an_object.a_json.branch-node.invalidleaf[)[)This is an invalid leaf
![)errbranch[)Invalid branching has a branch that does not exist
![)errbranch[)Best to remove the def
~~Header 6- Special Types
m[)Multi[)select[)apple&banana&cottage&doom[)'m' denotes a multi select
o[)Objects[)objarr[)[)'o' denotes the objects type; an array of objects.
